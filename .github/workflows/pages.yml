name: Build & deploy 3D viewer

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '3d-models/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install trimesh shapely manifold3d numpy-stl

      - name: Regenerate STL + GLB
        working-directory: 3d-models/sponge-holder
        run: |
          python3 generate_stl.py
          python3 test_faucet_clip.py
          python3 test_sponge_clip.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
